<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Verwaltungsleistungen im LeiKa suchen, Leistungsschlüssel nachschlagen und URNs kopieren."/>
  <meta name="color-scheme" content="light dark"/>
  <title>LeiKa-Suche</title>
  <style>
    :root {
      color-scheme: light;
      --font-ui: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-hover: #f3f8fb;
      --ink: #12304a;
      --muted: #52677b;
      --line: #d5dfe7;
      --accent: #007ba8;
      --link: #004a73;
      --code-bg: #e8eef3;
      --error: #a32626;
      --button-bg: #007ba8;
      --button-ink: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #061d2e;
        --surface: #0b2a3d;
        --surface-hover: #17455d;
        --ink: #eef8fc;
        --muted: #b3c9d6;
        --line: #35586a;
        --accent: #39bfe9;
        --link: #91e0f5;
        --code-bg: #143b52;
        --error: #fecaca;
        --button-bg: #0d6f92;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      line-height: 1.6;
    }
    .container { width: min(100% - 2rem, 56rem); margin: 3rem auto; }
    .tool-header { margin-bottom: 2rem; }
    .eyebrow {
      margin: 0 0 .5rem;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.75rem, 5vw, 2.25rem); line-height: 1.2; }
    .description { margin: 0; color: var(--muted); }
    .tool-section, .card {
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: var(--surface);
    }
    label { display: block; margin-bottom: .5rem; font-size: .9rem; font-weight: 650; }
    input[type="search"] {
      width: 100%;
      min-height: 3rem;
      padding: .75rem 1rem;
      border: 1px solid var(--line);
      border-radius: .5rem;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
    }
    :where(input, a, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .info { min-height: 1.6em; margin: .75rem 0 0; color: var(--muted); font-size: .9rem; }
    .info[data-error="true"] { color: var(--error); }
    .results { display: grid; gap: 1rem; margin-top: 1.5rem; }
    .card { padding: 1.25rem 1.5rem; overflow-wrap: anywhere; }
    .card-title { margin: 0 0 .75rem; font-size: 1.05rem; font-weight: 650; }
    a { color: var(--link); text-underline-offset: .2em; }
    .card-title a { text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card-id, .card-urn { margin: .5rem 0 0; font-size: .9rem; }
    code { font-family: var(--font-mono); font-size: .85rem; overflow-wrap: anywhere; }
    .leika-copy {
      max-width: 100%;
      padding: .4rem .6rem;
      border: 1px solid transparent;
      border-radius: .35rem;
      background: var(--code-bg);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .leika-copy:hover { border-color: var(--accent); }
    .pagination { display: flex; justify-content: center; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
    .pagination[hidden] { display: none; }
    .pagination span { align-self: center; }
    .button {
      min-width: 2.75rem;
      min-height: 2.75rem;
      padding: .5rem .75rem;
      border: 1px solid var(--line);
      border-radius: .4rem;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: .9rem;
      cursor: pointer;
    }
    .button:hover { background: var(--surface-hover); }
    .button[aria-current="page"] { border-color: var(--button-bg); background: var(--button-bg); color: var(--button-ink); }
    footer { margin-top: 2rem; color: var(--muted); font-size: .8rem; }
    @media (max-width: 480px) {
      .container { margin: 1.5rem auto; }
      .tool-section, .card { padding: 1rem; }
    }
  </style>
</head>
<body>
<main class="container">
  <header class="tool-header">
    <p class="eyebrow">Nachschlagen · Verwaltungsleistungen</p>
    <h1>LeiKa-Suche</h1>
    <p class="description">Verwaltungsleistungen finden und den passenden Leistungsschlüssel oder die URN übernehmen.</p>
  </header>
  <section class="tool-section" aria-label="Verwaltungsleistung suchen">
    <label for="searchInput">Leistung oder LeiKa-ID</label>
    <input id="searchInput" placeholder="z. B. Belehrung oder 99003002022000" type="search" autocomplete="off" aria-describedby="info"/>
    <p class="info" id="info" role="status" aria-live="polite">Gib eine Leistung oder einen Leistungsschlüssel ein.</p>
  </section>
  <section class="results" id="results" aria-label="Suchergebnisse" aria-busy="false"></section>
  <nav class="pagination" id="pagination" aria-label="Ergebnisseiten" hidden></nav>
  <noscript><p>Bitte aktiviere JavaScript, um die Suche zu verwenden.</p></noscript>
  <footer>Datenquelle: <a href="https://fimportal.de" target="_blank" rel="noopener noreferrer">FIM-Portal</a></footer>
</main>
<script>
  "use strict";

  const input = document.getElementById("searchInput");
  const resultsDiv = document.getElementById("results");
  const infoDiv = document.getElementById("info");
  const paginationDiv = document.getElementById("pagination");
  const pageSize = 20;
  const initialStatus = "Gib eine Leistung oder einen Leistungsschlüssel ein.";

  let debounceTimeout;
  let copyTimeout;
  let copiedButton;
  let requestController = null;
  let currentPage = 1;
  let totalPages = 1;

  function setStatus(message, isError = false) {
    infoDiv.textContent = message;
    infoDiv.dataset.error = String(isError);
  }

  function resetCopyFeedback() {
    clearTimeout(copyTimeout);
    if (copiedButton) {
      copiedButton.querySelector("code").textContent = copiedButton.dataset.urn;
      copiedButton = null;
    }
  }

  input.addEventListener("input", () => {
    clearTimeout(debounceTimeout);
    requestController?.abort();
    resetCopyFeedback();
    currentPage = 1;
    totalPages = 1;
    resultsDiv.replaceChildren();
    resultsDiv.setAttribute("aria-busy", "false");
    paginationDiv.replaceChildren();
    paginationDiv.hidden = true;
    const term = input.value.trim();
    setStatus(term ? "Suche wird vorbereitet …" : initialStatus);
    if (term) debounceTimeout = setTimeout(() => searchLeikaAPI(term), 400);
  });

  async function searchLeikaAPI(term) {
    requestController?.abort();
    const controller = new AbortController();
    requestController = controller;
    resetCopyFeedback();
    setStatus("Suche läuft …");
    resultsDiv.replaceChildren();
    resultsDiv.setAttribute("aria-busy", "true");
    paginationDiv.replaceChildren();
    paginationDiv.hidden = true;

    try {
      const params = new URLSearchParams({
        fts_query: term,
        order_by: "relevance",
        offset: String((currentPage - 1) * pageSize),
        limit: String(pageSize)
      });
      const response = await fetch(`https://fimportal.de/api/v0/leistung-steckbriefe?${params}`, {
        headers: { accept: "application/json" },
        signal: controller.signal
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      if (controller.signal.aborted) return;
      if (!Array.isArray(data.items) || !Number.isSafeInteger(data.total_count) || data.total_count < 0) {
        throw new Error("Unerwartetes Antwortformat");
      }

      totalPages = Math.max(1, Math.ceil(data.total_count / pageSize));
      if (!data.items.length) {
        setStatus("Keine Leistungen gefunden.");
        return;
      }

      const cards = data.items.map(createResultCard);
      resultsDiv.replaceChildren(...cards);
      setStatus(`Gefundene Leistungen: ${data.total_count.toLocaleString("de-DE")} · Seite ${currentPage} von ${totalPages.toLocaleString("de-DE")}`);
      renderPagination(term);
    } catch (error) {
      if (!controller.signal.aborted) {
        setStatus("Die Leistungen konnten nicht geladen werden. Bitte versuche es erneut.", true);
      }
    } finally {
      if (requestController === controller) {
        requestController = null;
        resultsDiv.setAttribute("aria-busy", "false");
      }
    }
  }

  function createResultCard(item) {
    if (!item || typeof item !== "object" || !/^\d+$/.test(String(item.leistungsschluessel ?? ""))) {
      throw new Error("Ungültiger Leistungsschlüssel");
    }
    const id = String(item.leistungsschluessel);
    const title = item.title || item.leistungsbezeichnung || "(Kein Titel)";
    const urn = `urn:de:fim:leika:leistung:${id}`;
    const card = document.createElement("article");
    card.className = "card";

    const heading = document.createElement("h2");
    heading.className = "card-title";
    const link = document.createElement("a");
    link.href = `https://fimportal.de/services/${encodeURIComponent(id)}`;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = title;
    heading.append(link);

    const idLine = document.createElement("p");
    idLine.className = "card-id";
    const key = document.createElement("strong");
    key.textContent = id;
    idLine.append("LeiKa-ID: ", key);

    const urnLine = document.createElement("p");
    urnLine.className = "card-urn";
    const copyButton = document.createElement("button");
    copyButton.type = "button";
    copyButton.className = "leika-copy";
    copyButton.dataset.urn = urn;
    copyButton.title = `URN ${urn} kopieren`;
    copyButton.setAttribute("aria-label", `URN ${urn} kopieren`);
    const code = document.createElement("code");
    code.textContent = urn;
    copyButton.append(code);
    copyButton.addEventListener("click", () => copyUrn(copyButton, urn));
    urnLine.append("URN: ", copyButton);

    card.append(heading, idLine, urnLine);
    return card;
  }

  function renderPagination(term) {
    paginationDiv.replaceChildren();
    paginationDiv.hidden = totalPages <= 1;
    if (totalPages <= 1) return;

    function createButton(label, page, ariaLabel) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "button secondary";
      button.textContent = label;
      button.setAttribute("aria-label", ariaLabel);
      if (page === currentPage) button.setAttribute("aria-current", "page");
      button.addEventListener("click", () => {
        if (page === currentPage) return;
        currentPage = page;
        searchLeikaAPI(term);
      });
      paginationDiv.append(button);
    }

    if (currentPage > 1) createButton("Zurück", currentPage - 1, "Vorherige Seite");
    const pages = new Set([1, totalPages]);
    for (let page = Math.max(1, currentPage - 2); page <= Math.min(totalPages, currentPage + 2); page += 1) {
      pages.add(page);
    }
    let previousPage = 0;
    for (const page of [...pages].sort((a, b) => a - b)) {
      if (previousPage && page - previousPage > 1) {
        const dots = document.createElement("span");
        dots.textContent = "…";
        dots.setAttribute("aria-hidden", "true");
        paginationDiv.append(dots);
      }
      createButton(String(page), page, `Seite ${page}`);
      previousPage = page;
    }
    if (currentPage < totalPages) createButton("Weiter", currentPage + 1, "Nächste Seite");
  }

  async function copyUrn(button, urn) {
    try {
      await navigator.clipboard.writeText(urn);
      if (!button.isConnected) return;
      resetCopyFeedback();
      copiedButton = button;
      button.querySelector("code").textContent = "Kopiert";
      setStatus("URN in die Zwischenablage kopiert.");
      copyTimeout = setTimeout(resetCopyFeedback, 1200);
    } catch (_) {
      if (button.isConnected) {
        setStatus("Die URN konnte nicht kopiert werden. Bitte markiere und kopiere sie manuell.", true);
      }
    }
  }
</script>
</body>
</html>
